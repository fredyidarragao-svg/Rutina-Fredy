name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar Android SDK preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses || true

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: rutina-fredy-apk
          path: app/build/outputs/apk/debug/app-debug.apk
